  GAL.db.catch(() => { GAL.db = null; }); return GAL.db;
}
async function dbTx(store, mode, fn){ const db = await galDB(); return new Promise((res, rej) => { const tx = db.transaction(store, mode), st = tx.objectStore(store), out = fn(st); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); }); }
const galTx = (mode, fn) => dbTx('items', mode, fn);
async function galLoad(){ try { GAL.items = (await galTx('readonly', st => st.getAll())) || []; } catch (e) { GAL.items = []; } GAL.items.sort((a, b) => b.t - a.t); renderGallery(); }
async function galAdd(kind, canvas, meta = {}){
  const max = kind === 'sticker' ? 1400 : 2400, c = scaled(canvas, max);
  const blob = await new Promise(r => c.toBlob(r, kind === 'sticker' ? 'image/png' : 'image/jpeg', .9));
  const tc0 = scaled(canvas, 240), tc = kind === 'sticker' && meta.border ? outlined(tc0, meta.border * tc0.width / canvas.width, '#FFFFFF') : tc0, thumb = tc.toDataURL(kind === 'sticker' ? 'image/png' : 'image/jpeg', .82);
  const item = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), kind, blob, thumb, t: Date.now(), border: meta.border ?? 16 };
  try { await galTx('readwrite', st => st.put(item)); GAL.items.unshift(item);
    const same = GAL.items.filter(i => i.kind === kind); if (same.length > 60) { const old = same[same.length - 1]; await galTx('readwrite', st => st.delete(old.id)); GAL.items = GAL.items.filter(i => i !== old); }
  } catch (e) { toast('Could not save to this device’s storage'); }
  renderGallery();
}
async function galDel(item){ try { await galTx('readwrite', st => st.delete(item.id)); } catch (e) {} GAL.items = GAL.items.filter(i => i !== item); renderGallery(); }
function renderGallery(){
  const G = $('#galGrid'); if (!G) return; G.innerHTML = '';
  const st = GAL.items.filter(i => i.kind === 'sticker'), ph = GAL.items.filter(i => i.kind === 'photo');
  $('#gcS').textContent = st.length || ''; $('#gcP').textContent = ph.length || '';
  document.querySelectorAll('.galtab').forEach(b => b.setAttribute('aria-selected', b.dataset.g === GAL.tab));
  const list = GAL.tab === 'sticker' ? st : ph;
  if (!list.length) { const e = document.createElement('div'); e.className = 'galempty';
    e.innerHTML = GAL.tab === 'sticker' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4h9l5 5v11H6z" stroke-dasharray="3 2.4"/><path d="M15 4v5h5"/></svg><span>Stickers you make appear here.<br>Try Magic Eraser in Quick actions.</span>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg><span>Photos you save from the editor appear here.</span>';
    G.appendChild(e); return; }
  list.forEach(it => { const b = document.createElement('button'); b.className = 'gi ' + (it.kind === 'sticker' ? 'st' : 'ph'); b.setAttribute('aria-label', it.kind === 'sticker' ? 'Sticker' : 'Edited photo');
    const im = document.createElement('img'); im.alt = ''; im.loading = 'lazy'; im.src = it.thumb; b.appendChild(im); b.onclick = () => galOpen(it); G.appendChild(b); });
}
document.querySelectorAll('.galtab').forEach(b => b.onclick = () => { GAL.tab = b.dataset.g; renderGallery(); });
async function blobCanvas(blob){ const bmp = await createImageBitmap(blob), c = mk(bmp.width, bmp.height); c.getContext('2d').drawImage(bmp, 0, 0); bmp.close && bmp.close(); return c; }
function galOpen(it){
  const st = it.kind === 'sticker';
  overlay(`<div class="gprev"><img alt=""></div><div class="menu">
    <button class="btn primary" id="gA">${st ? 'Add to canvas' : 'Edit this photo'}</button>
    <button class="btn" id="gS">Save to phone</button>
    <button class="btn" id="gD">Delete</button></div>${st ? '' : '<p class="mono">Editing starts a new canvas from this photo.</p>'}
    <div class="btnrow end"><button class="btn" id="gC">Close</button></div>`);
  const url = URL.createObjectURL(it.blob); $('#overlayCard .gprev img').src = url;
  const done = () => { URL.revokeObjectURL(url); closeOverlay(); };
  $('#gC').onclick = done;
  $('#gS').onclick = async () => { const c0 = await blobCanvas(it.blob), c = st && it.border ? outlined(c0, it.border, '#FFFFFF') : c0; done(); saveCanvas(c, 'seedling-' + it.kind + '-' + it.t + '.png'); };
  $('#gD').onclick = () => { const b = $('#gD'); if (b.dataset.sure) { done(); galDel(it); toast('Deleted'); } else { b.dataset.sure = 1; b.textContent = 'Tap again to delete'; b.style.color = 'var(--die)'; } };
  $('#gA').onclick = async () => { const c = await blobCanvas(it.blob); done();
    if (st) { hideHome(); const L = addLayer({ kind: 'sticker', name: 'Sticker ' + (layers.filter(l => l.kind === 'sticker').length + 1), src: c, outline: it.border ?? SET.border, shadow: SET.shadow }); fitLayer(L, .6); draw(); refresh(); }
    else openAsCanvas(c, 'Photo'); };
}
const SIZES = [['Square', 1350, 1350], ['Portrait', 1080, 1350], ['Story', 760, 1350], ['Landscape', 1350, 760]];
function showHome(){
  pendingTool = null; const h = $('#home'); h.hidden = false; h.classList.add('again'); if (TS) closeTool();
  const c = mk(Math.max(1, Math.round(W * 96 / H)), 96), g = c.getContext('2d'); g.scale(c.width / W, c.height / H); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); layers.forEach(L => drawLayer(g, L));
  $('#homeThumb').src = c.toDataURL('image/jpeg', .8);
  $('#homeContLbl').textContent = layers.some(l => !l.sample) ? 'Continue editing' : 'Try the sample';
  renderGallery();
}
function hideHome(){ $('#home').hidden = true; mode = 'main'; fitStage(); refresh(); }
function openAsCanvas(c, name){
  layers = []; selId = null;
  const ar = c.width / c.height; setDoc(ar >= 1 ? 1350 : Math.round(1350 * ar), ar >= 1 ? Math.round(1350 / ar) : 1350);
  const L = addLayer({ kind: 'photo', name, src: c, isBg: true }); L.scale = W / c.width;
  hideHome(); select(null);
}
function newCanvas(w, h, name){
  const c = mk(w, h), g = c.getContext('2d'); g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, w, h);
  openAsCanvas(c, name + ' canvas'); toast('New ' + name.toLowerCase() + ' canvas');
}
$('#homeBlank').onclick = () => {
  overlay(`<h2>Blank canvas</h2><div class="sizes4" id="szGrid"></div><div class="btnrow end"><button class="btn" id="szC">Cancel</button></div>`);
  SIZES.forEach(([n, w, h]) => { const b = document.createElement('button'); b.className = 'sz'; const k = 34 / Math.max(w, h);
    b.innerHTML = `<i><span style="width:${Math.round(w * k)}px;height:${Math.round(h * k)}px"></span></i><b>${n}</b><small>${w}×${h}</small>`;
    b.onclick = () => { closeOverlay(); newCanvas(w, h, n); }; $('#szGrid').appendChild(b); });
  $('#szC').onclick = closeOverlay;
};
$('#homeContinue').onclick = hideHome;
$('#homeGear').onclick = openSettings; $('#setBack').onclick = closeSettings;
/* Quick actions pick a photo, then go straight to that tool (Remove Background makes a sticker and comes back here) */
const QUICK = [['enhance', 'Enhance', 'auto'], ['retouch', 'Retouch', 'face'], ['blur', 'Portrait Blur', 'portrait'], ['background', 'Background Changer', 'bgswap'], ['remove', 'Magic Eraser', 'cutout'], ['upscale', 'Upscale', 'upscale']];
let pendingTool = null;
QUICK.forEach(([img, label, tool]) => { const l = document.createElement('label'); l.className = 'qt'; l.htmlFor = tool === 'cutout' ? 'fileSticker' : 'filePhoto'; l.tabIndex = 0; l.setAttribute('role', 'button'); l.dataset.tool = tool;
  l.innerHTML = `<img alt="" src="home/${img}.jpg"><span>${label}</span>`; l.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); l.click(); } }); $('#qrow').appendChild(l); });
document.addEventListener('click', e => { const l = e.target.closest && e.target.closest('label[for="filePhoto"]'); if (l) pendingTool = l.dataset.tool || null; }, true);
$('#homeBtn').onclick = showHome;
['#homeOpen'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $(id).click(); } }));
galLoad();
setTimeout(() => { const sp = $('#splash'); if (sp) sp.remove(); }, 1700);
(async function init(){
  // sample: a Pexels portrait, nothing added on top
  let src = null;
  try { const r = await fetch('sample.jpg'); if (r.ok) { const bmp = await createImageBitmap(await r.blob()); src = mk(bmp.width, bmp.height); src.getContext('2d').drawImage(bmp, 0, 0); } } catch (e) {}
  if (!src) src = sampleBg();
  const ar = src.width / src.height; W = ar >= 1 ? 1350 : Math.round(1350 * ar); H = ar >= 1 ? Math.round(1350 / ar) : 1350; stage.width = W; stage.height = H;
  const L = addLayer({ kind: 'photo', name: 'Sample photo', src, isBg: true, sample: true }); L.scale = W / src.width;
