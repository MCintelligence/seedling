# Builds an installable Seedling APK for personal testing (debug-signed, not for the Play Store).
# Runs on every push to main, or by hand from the Actions tab. The APK appears under the run's "Artifacts".
name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners already include the Android SDK; just accept its licences
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk seedling-1.0.0-personal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: seedling-apk
          path: seedling-1.0.0-personal.apk
          retention-days: 30
      # Also keep the latest APK on a "builds" branch, so it can be downloaded with git
      - name: Publish APK to the builds branch
        run: |
          mkdir out && cp seedling-1.0.0-personal.apk out/ && cd out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seedling-1.0.0-personal.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
